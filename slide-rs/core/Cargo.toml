[package]
name = "slide-core"
version = { workspace = true }
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
sha2 = "0.10"
sha1 = "0.10"
anyhow = "1"
slide-common = { path = "../common" }
slide-chatgpt = { path = "../chatgpt" }
slide-apply-patch = { path = "../apply-patch" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tree-sitter = "0.25.8"
tree-sitter-bash = "0.25.0"
serde_json = "1.0.143"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
futures = "0.3"
async-channel = "2.5.0"
mcp-types = "0.1.1"
toml = "0.8"
shlex = "1.3"
maplit = "1.0"
protocol = { path = "../protocol" }
slide-mcp-client = { path = "../mcp-client" }
regex = "1.0"
portable-pty = "0.8"
rand = "0.9"
