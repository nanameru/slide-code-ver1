[package]
name = "slide-mcp-client"
version = { workspace = true }
edition = "2021"

[lints]
workspace = true

[dependencies]
anyhow = "1"
mcp-types = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
